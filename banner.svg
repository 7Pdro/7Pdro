<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030A"/>
      <stop offset="0.6" stop-color="#150B2B"/>
      <stop offset="1" stop-color="#2D1B4E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5D77A"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#F5D77A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5D77A" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1200" height="300" fill="white"/>
      <circle cx="1032" cy="88" r="52" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#sky)"/>

  <!-- estrelas -->
  <g fill="#FFFFFF">
    <circle cx="90" cy="50" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="35" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="70" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="40" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="120" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="40" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="130" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- lua crescente -->
  <circle cx="1000" cy="100" r="110" fill="url(#glow)"/>
  <circle cx="1000" cy="100" r="58" fill="#F5E6A8" mask="url(#crescent)"/>

  <!-- figura encapuzada com foice -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="5s" repeatCount="indefinite"/>
    <!-- foice -->
    <line x1="292" y1="285" x2="262" y2="45" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
    <path d="M262 45 Q335 32 388 98 Q326 64 266 68 Z" fill="url(#gold)"/>
    <!-- manto -->
    <path d="M168 300 L190 172 Q220 118 250 172 L272 300 L254 284 L238 300 L222 283 L206 300 L188 284 Z" fill="#07040E" stroke="#4C1D95" stroke-width="1.5"/>
    <ellipse cx="220" cy="160" rx="17" ry="21" fill="#000"/>
    <circle cx="213" cy="158" r="2.6" fill="#FF8FB1"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="227" cy="158" r="2.6" fill="#FF8FB1"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- título -->
  <text x="640" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="bold" fill="url(#gold)" letter-spacing="4">Pedro Paulo</text>
  <line x1="560" y1="175" x2="720" y2="175" stroke="#FF8FB1" stroke-width="2" stroke-linecap="round"/>
  <text x="640" y="212" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#FFD6E7" letter-spacing="5">ESTUDANTE  •  CÓDIGO  •  DESIGN</text>

  <!-- névoa -->
  <g fill="#C4B5FD">
    <ellipse cx="300" cy="295" rx="380" ry="26" opacity="0.10">
      <animateTransform attributeName="transform" type="translate" values="-40 0; 40 0; -40 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="880" cy="290" rx="420" ry="30" opacity="0.12" fill="#FF8FB1">
      <animateTransform attributeName="transform" type="translate" values="50 0; -50 0; 50 0" dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
