<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <clipPath id="clip"><rect width="1200" height="340" rx="18"/></clipPath>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>

    <linearGradient id="orbRoxo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9D3BD5"/>
      <stop offset="0.5" stop-color="#E4B7FF"/>
      <stop offset="1" stop-color="#9D3BD5"/>
    </linearGradient>
    <linearGradient id="orbVerde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30FF37"/>
      <stop offset="1" stop-color="#5EC990"/>
    </linearGradient>

    <!-- gradiente animado do "Pedro" -->
    <linearGradient id="gPedro" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="490" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#9D3BD5"/>
      <stop offset="0.35" stop-color="#aa44e6"/>
      <stop offset="0.65" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#9D3BD5"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- gradiente animado do "Paulo" -->
    <linearGradient id="gPaulo" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="490" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#30FF37"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#1dd320"/>
      <stop offset="1" stop-color="#30FF37"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- moldura ornamental do canto -->
    <g id="moldura" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 96 C0 40 40 0 96 0" stroke="#d5bbf2" stroke-width="5"/>
      <path d="M96 0 C122 -4 134 18 120 28 C108 36 94 24 102 14" stroke="#d5bbf2" stroke-width="4"/>
      <path d="M0 96 C-4 122 18 134 28 120 C36 108 24 94 14 102" stroke="#d5bbf2" stroke-width="4"/>
      <path d="M22 70 C26 46 46 26 70 22" stroke="#5EC990" stroke-width="3"/>
      <path d="M52 8 C60 -4 74 -2 74 10 C64 14 56 14 52 8 Z" fill="#5EC990" stroke="none"/>
      <path d="M8 52 C-4 60 -2 74 10 74 C14 64 14 56 8 52 Z" fill="#5EC990" stroke="none"/>
      <circle cx="30" cy="30" r="4" fill="#AE7CD9" stroke="none"/>
    </g>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="#0b0c10"/>

    <!-- círculos de fundo (como no portfólio) -->
    <g filter="url(#blur)">
      <circle cx="140" cy="60" r="150" fill="url(#orbRoxo)" opacity="0.75">
        <animateTransform attributeName="transform" type="translate" values="0 0; 70 40; 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="300" r="140" fill="url(#orbVerde)" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0 0; -80 -40; 0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="360" r="110" fill="url(#orbRoxo)" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0 0; 60 -30; 0 0" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- painel de vidro -->
  <rect x="40" y="38" width="1120" height="264" rx="62" fill="#525151" fill-opacity="0.45" stroke="#AE7CD9" stroke-width="6"/>

  <!-- molduras dos cantos -->
  <use href="#moldura" x="20" y="18"/>
  <use href="#moldura" transform="translate(1180 322) rotate(180)"/>

  <!-- lado esquerdo: nome -->
  <text x="100" y="104" font-family="'Intel One Mono', 'Courier New', monospace" font-size="24" fill="#ffffff">Hello, I'm</text>
  <text x="96" y="188" font-family="'Intel One Mono', 'Courier New', monospace" font-size="78" letter-spacing="-4" fill="url(#gPedro)">Pedro</text>
  <text x="96" y="268" font-family="'Intel One Mono', 'Courier New', monospace" font-size="78" letter-spacing="-4" fill="url(#gPaulo)">Paulo</text>

  <!-- lado direito: estilo do painel Projects -->
  <text x="640" y="104" font-family="'Intel One Mono', 'Courier New', monospace" font-size="30" fill="#ffffff">Projects</text>
  <line x1="780" y1="95" x2="1118" y2="95"
