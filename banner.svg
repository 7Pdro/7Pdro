<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030A"/>
      <stop offset="0.65" stop-color="#150B2B"/>
      <stop offset="1" stop-color="#2D1B4E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5D77A"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#F5D77A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5D77A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1200" height="320" fill="white"/>
      <circle cx="1112" cy="86" r="50" fill="black"/>
    </mask>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#sky)"/>

  <!-- redemoinho de pesadelo -->
  <g fill="none" stroke-linecap="round">
    <circle cx="760" cy="170" r="70" stroke="#A855F7" stroke-width="2" stroke-dasharray="14 18" opacity="0.18">
      <animateTransform attributeName="transform" type="rotate" from="0 760 170" to="360 760 170" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="170" r="125" stroke="#FF8FB1" stroke-width="2" stroke-dasharray="6 22" opacity="0.16">
      <animateTransform attributeName="transform" type="rotate" from="360 760 170" to="0 760 170" dur="55s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="170" r="185" stroke="#D4AF37" stroke-width="2" stroke-dasharray="10 30" opacity="0.14">
      <animateTransform attributeName="transform" type="rotate" from="0 760 170" to="360 760 170" dur="70s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="170" r="250" stroke="#A855F7" stroke-width="2" stroke-dasharray="4 26" opacity="0.14">
      <animateTransform attributeName="transform" type="rotate" from="360 760 170" to="0 760 170" dur="90s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- estrelas -->
  <g fill="#FFFFFF">
    <circle cx="90" cy="50" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="40" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="90" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="40" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="160" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="200" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- lua -->
  <circle cx="1080" cy="100" r="110" fill="url(#glow)"/>
  <circle cx="1080" cy="100" r="58" fill="#F5E6A8" mask="url(#crescent)"/>

  <!-- DEATH 13 (inspirado) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="5s" repeatCount="indefinite"/>

    <!-- foice -->
    <line x1="420" y1="318" x2="398" y2="22" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    <path d="M398 22 Q500 8 556 96 Q470 52 402 58 Z" fill="url(#gold)" stroke="#F5D77A" stroke-width="1"/>
    <path d="M404 30 Q480 22 530 80" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>

    <!-- manto rasgado com cauda fantasma -->
    <path d="M184 190 Q230 176 276 190 L296 250 Q306 292 272 304 Q252 326 240 298 Q228 326 212 300 Q190 320 180 284 Q160 248 184 190 Z" fill="#07040E" stroke="#4C1D95" stroke-width="1.8"/>
    <path d="M200 215 L208 226 L200 237 L192 226 Z" fill="#FF8FB1"/>
    <path d="M252 235 L260 246 L252 257 L244 246 Z" fill="#D4AF37"/>
    <path d="M222 262 L229 272 L222 282 L215 272 Z" fill="#A855F7"/>

    <!-- braço longo até a foice -->
    <path d="M268 205 Q330 222 404 200" fill="none" stroke="#07040E" stroke-width="14" stroke-linecap="round"/>
    <!-- garras -->
    <circle cx="405" cy="200" r="7" fill="#EDE3F7"/>
    <g stroke="#EDE3F7" stroke-width="2.4" stroke-linecap="round">
      <line x1="402" y1="196" x2="390" y2="186"/>
      <line x1="406" y1="194" x2="402" y2="178"/>
      <line x1="410" y1="196" x2="418" y2="182"/>
    </g>
    <!-- mão esquerda -->
    <path d="M190 205 Q160 225 150 252" fill="none" stroke="#07040E" stroke-width="12" stroke-linecap="round"/>
    <g stroke="#EDE3F7" stroke-width="2.2" stroke-linecap="round">
      <line x1="150" y1="254" x2="140" y2="268"/>
      <line x1="150" y1="254" x2="150" y2="271"/>
      <line x1="150" y1="254" x2="160" y2="268"/>
    </g>

    <!-- pescoço -->
    <rect x="216" y="172" width="28" height="20" fill="#07040E"/>

    <!-- cabeça grande -->
    <ellipse cx="230" cy="138" rx="50" ry="46" fill="#EDE3F7"/>
    <ellipse cx="230" cy="138" rx="50" ry="46" fill="none" stroke="#C4B5FD" stroke-width="1.5"/>

    <!-- sobrancelhas tortas -->
    <path d="M190 112 L216 122" stroke="#0B0714" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M270 112 L244 122" stroke="#0B0714" stroke-width="3.5" stroke-linecap="round"/>

    <!-- olhos: órbita escura + pupila pequena -->
    <ellipse cx="210" cy="132" rx="14" ry="16" fill="#0B0714"/>
    <ellipse cx="250" cy="132" rx="14" ry="16" fill="#0B0714"/>
    <circle cx="210" cy="134" r="4" fill="#FF8FB1"><animate attributeName="opacity" values="1;0.25;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="134" r="4" fill="#FF8FB1"><animate attributeName="opacity" values="1;0.25;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="134" r="1.3" fill="#0B0714"/>
    <circle cx="250" cy="134" r="1.3" fill="#0B0714"/>

    <!-- bochechas em losango -->
    <path d="M188 152 L193 159 L188 166 L183 159 Z" fill="#FF8FB1"/>
    <path d="M272 152 L277 159 L272 166 L267 159 Z" fill="#FF8FB1"/>

    <!-- sorrisão cheio de dentes -->
    <path d="M190 156 Q230 212 270 156 Q230 172 190 156 Z" fill="#0B0714" stroke="#FF8FB1" stroke-width="1.4" stroke-linejoin="round"/>
    <g fill="#F3E8FF">
      <polygon points="196,159 202,159 199,167"/>
      <polygon points="206,162 213,163 209,171"/>
      <polygon points="217,165 224,166 220,174"/>
      <polygon points="227,166 234,166 230,175"/>
      <polygon points="237,166 244,165 240,174"/>
      <polygon points="247,163 254,162 250,171"/>
      <polygon points="258,159 264,159 261,167"/>
    </g>
    <g fill="#F3E8FF">
      <polygon points="208,186 214,181 218,188"/>
      <polygon points="222,192 228,185 234,192"/>
      <polygon points="242,188 246,181 252,186"/>
    </g>

    <!-- chapéu de bobo da corte caído -->
    <path d="M196 104 C150 54 104 84 120 146" fill="none" stroke="#6D28D9" stroke-width="22" stroke-linecap="round"/>
    <path d="M264 104 C310 54 356 84 340 146" fill="none" stroke="#FF8FB1" stroke-width="22" stroke-linecap="round"/>
    <path d="M182 118 Q230 66 278 118 L278 128 Q230 108 182 128 Z" fill="#4C1D95" stroke="#A855F7" stroke-width="1.2"/>
    <path d="M182 120 Q230 100 278 120 L278 129 Q230 109 182 129 Z" fill="url(#gold)"/>
    <circle cx="120" cy="150" r="9" fill="url(#gold)"><animate attributeName="cy" values="150;156;150" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="150" r="9" fill="url(#gold)"><animate attributeName="cy" values="150;156;150" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="80" r="6" fill="url(#gold)"/>
  </g>

  <!-- título -->
  <text x="790" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="url(#gold)" letter-spacing="4">Pedro Paulo</text>
  <line x1="710" y1="182" x2="870" y2="182" stroke="#FF8FB1" stroke-width="2" stroke-linecap="round"/>
  <text x="790" y="218" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#FFD6E7" letter-spacing="5">ESTUDANTE  •  CÓDIGO  •  DESIGN</text>

  <!-- névoa -->
  <g>
    <ellipse cx="300" cy="312" rx="380" ry="26" fill="#C4B5FD" opacity="0.12">
      <animateTransform attributeName="transform" type="translate" values="-40 0; 40 0; -40 0" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="880" cy="308" rx="420" ry="30" fill="#FF8FB1" opacity="0.12">
      <animateTransform attributeName="transform" type="translate" values="50 0; -50 0; 50 0" dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect width="1200" height="320" rx="18" fill="url(#vignette)"/>
</svg>
