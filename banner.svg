<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D1B4E"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5D77A"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <circle cx="1040" cy="60" r="120" fill="#FF8FB1" opacity="0.12"/>
  <circle cx="1120" cy="210" r="80" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="90" cy="230" r="90" fill="#D4AF37" opacity="0.10"/>

  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="180" cy="50" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="40" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="130" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="215" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="125" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="bold" fill="url(#gold)" letter-spacing="3">Pedro Paulo</text>

  <line x1="520" y1="150" x2="680" y2="150" stroke="#FF8FB1" stroke-width="2" stroke-linecap="round"/>

  <text x="600" y="190" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="19" fill="#FFD6E7" letter-spacing="4">ESTUDANTE  •  TÉCNICO  •  CÓDIGO &amp; DESIGN</text>
</svg>
